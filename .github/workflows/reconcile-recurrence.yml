name: Reconciliação da recorrência (Degrau 13 + cupom)

# Recompõe o valor da recorrência do Asaas quando muda no aniversário: Degrau 13
# (anual, mês>=13 → piso) e fim do desconto do cupom (termo da assinatura).
# Idempotente. 1×/dia, 06:00 UTC (03h BRT). Secrets: CORE_URL, WEBHOOK_SECRET.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  reconcile-recurrence:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/reconcile-recurrence
        env:
          CORE_URL: ${{ secrets.CORE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "$CORE_URL/api/cron/reconcile-recurrence" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" | jq .
