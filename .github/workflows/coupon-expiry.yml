name: Cupom — expiração de resgates

# Devolve a recorrência do Asaas ao preço de tabela quando o desconto do cupom
# vence, e encerra o resgate. Idempotente. 1×/dia, 06:00 UTC (03h BRT).
# Secrets: CORE_URL, WEBHOOK_SECRET.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  coupon-expiry:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/coupon-expiry
        env:
          CORE_URL: ${{ secrets.CORE_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body -sS -X POST "$CORE_URL/api/cron/coupon-expiry" \
            -H "x-webhook-secret: $WEBHOOK_SECRET" | jq .
